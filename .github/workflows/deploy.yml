name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

# Grant necessary permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs in-progress
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Inject Supabase Secrets safely into index.html
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            const filePath = "index.html";
            let fileContent = fs.readFileSync(filePath, "utf8");

            const supabaseUrl = process.env.SUPABASE_URL || "";
            const supabaseKey = process.env.SUPABASE_ANON_KEY || "";

            if (!supabaseUrl || !supabaseKey) {
              console.error("ERROR: SUPABASE_URL or SUPABASE_ANON_KEY is missing in GitHub Secrets.");
              process.exit(1);
            }

            fileContent = fileContent.replace("__SUPABASE_URL__", supabaseUrl);
            fileContent = fileContent.replace("__SUPABASE_ANON_KEY__", supabaseKey);

            fs.writeFileSync(filePath, fileContent, "utf8");
            console.log("Successfully injected Supabase secrets into index.html");
          '

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
