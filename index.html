<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    .autohide-target {
      transition: opacity 0.25s ease-in-out, transform 0.25s ease-in-out;
    }
    .autohide-target.is-hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .animate-toast {
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="h-full overflow-hidden font-sans antialiased selection:bg-brand-500 selection:text-white" onclick="requestNotificationPermission()">

  <!-- Toast Notification Container (In-App) -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

  <div class="flex h-full w-full overflow-hidden">

    <!-- Left Profile & Navigation Panel -->
    <aside id="left-panel" class="group/sidebar relative flex flex-col border-r border-slate-800 bg-slate-900/80 backdrop-blur-md transition-all duration-300 ease-in-out z-30 w-16 md:w-80 shrink-0">
      
      <!-- Panel Header / User Profile -->
      <div class="p-3 md:p-4 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-3 overflow-hidden">
          <div class="relative shrink-0">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Avatar" class="w-10 h-10 rounded-full object-cover ring-2 ring-brand-500/50">
            <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 rounded-full ring-2 ring-slate-900"></span>
          </div>
          <div class="hidden md:block truncate min-w-0">
            <h2 class="font-semibold text-sm text-slate-100 truncate">Alex Rivera</h2>
            <p class="text-xs text-slate-400 truncate">Available</p>
          </div>
        </div>

        <button id="toggle-sidebar-btn" onclick="toggleSidebar()" class="p-2 text-slate-400 hover:text-slate-100 hover:bg-slate-800 rounded-lg transition-colors">
          <svg id="sidebar-icon-expand" class="w-5 h-5 md:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/></svg>
          <svg id="sidebar-icon-collapse" class="w-5 h-5 hidden md:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/></svg>
        </button>
      </div>

      <!-- Quick Actions -->
      <div class="p-2 border-b border-slate-800 flex justify-around md:justify-start md:gap-1">
        <button class="p-2.5 text-brand-500 bg-brand-500/10 rounded-xl transition-colors relative">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        </button>
        <button onclick="requestNotificationPermission(true)" title="Enable System Notifications" class="p-2.5 text-slate-400 hover:text-slate-200 hover:bg-slate-800 rounded-xl transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        </button>
      </div>

      <!-- Conversations List -->
      <div class="flex-1 overflow-y-auto p-2 space-y-1">
        <div onclick="selectChat(1)" class="chat-item flex items-center gap-3 p-2.5 rounded-xl bg-slate-800/80 cursor-pointer transition-colors relative">
          <div class="relative shrink-0">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop&q=80" class="w-10 h-10 rounded-full object-cover">
            <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-500 rounded-full ring-2 ring-slate-900"></span>
          </div>
          <div class="hidden md:block flex-1 min-w-0">
            <div class="flex justify-between items-baseline">
              <h3 class="text-sm font-medium text-slate-100 truncate">Sarah Jenkins</h3>
              <span class="text-[10px] text-slate-400">12:42 PM</span>
            </div>
            <p class="text-xs text-slate-400 truncate">Sounds good, let me know when...</p>
          </div>
        </div>

        <div onclick="selectChat(2)" class="chat-item flex items-center gap-3 p-2.5 rounded-xl hover:bg-slate-800/50 cursor-pointer transition-colors relative">
          <div class="relative shrink-0">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&auto=format&fit=crop&q=80" class="w-10 h-10 rounded-full object-cover">
            <span id="unread-badge-2" class="hidden absolute -top-1 -right-1 bg-brand-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full ring-2 ring-slate-900">1</span>
          </div>
          <div class="hidden md:block flex-1 min-w-0">
            <div class="flex justify-between items-baseline">
              <h3 class="text-sm font-medium text-slate-100 truncate">David Chen</h3>
              <span class="text-[10px] text-slate-400">11:15 AM</span>
            </div>
            <p class="text-xs text-slate-400 truncate">Can you send the design tokens?</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main id="chat-workspace" class="flex-1 flex flex-col h-full bg-slate-950 relative overflow-hidden">

      <header id="autohide-header" class="autohide-target absolute top-0 left-0 right-0 z-20 flex items-center justify-between px-6 py-4 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
        <div class="flex items-center gap-3">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop&q=80" class="w-9 h-9 rounded-full object-cover">
          <div>
            <h2 class="text-sm font-semibold text-slate-100">Sarah Jenkins</h2>
            <p class="text-xs text-emerald-400 flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Active now
            </p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button onclick="triggerSimulatedMessage()" class="px-3 py-1.5 text-xs font-medium bg-brand-600 hover:bg-brand-500 text-white rounded-lg transition-colors">
            Simulate Incoming Msg
          </button>
        </div>
      </header>

      <div id="messages-container" class="flex-1 overflow-y-auto p-6 pt-20 pb-24 space-y-4">
        <div class="flex justify-center">
          <span class="text-[11px] text-slate-500 bg-slate-900 px-3 py-1 rounded-full border border-slate-800">Today</span>
        </div>

        <div class="flex items-start gap-3 max-w-lg">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop&q=80" class="w-8 h-8 rounded-full object-cover">
          <div class="bg-slate-800 text-slate-200 p-3.5 rounded-2xl rounded-tl-sm text-sm border border-slate-700/50 shadow-sm">
            Hey! Are you working on the dark mode update today?
          </div>
        </div>

        <div class="flex items-start gap-3 max-w-lg ml-auto flex-row-reverse">
          <div class="bg-brand-600 text-white p-3.5 rounded-2xl rounded-tr-sm text-sm shadow-sm">
            Yes, setting up the auto-hiding navigation and profile drawer right now!
          </div>
        </div>
      </div>

      <div id="autohide-footer" class="autohide-target absolute bottom-0 left-0 right-0 z-20 p-4 bg-slate-900/90 backdrop-blur-md border-t border-slate-800">
        <form onsubmit="sendMessage(event)" class="flex items-center gap-2 max-w-4xl mx-auto">
          <input type="text" id="message-input" placeholder="Type a message..." class="flex-1 bg-slate-950 text-slate-100 text-sm px-4 py-3 rounded-xl border border-slate-800 focus:outline-none focus:border-brand-500 transition-colors">
          <button type="submit" class="p-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl transition-colors shrink-0">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
          </button>
        </form>
      </div>

    </main>
  </div>

  <script>
    /* Feature 1: Cursor Auto-Hide Logic */
    const workspace = document.getElementById('chat-workspace');
    const autohideElements = [
      document.getElementById('autohide-header'),
      document.getElementById('autohide-footer')
    ];
    let idleTimeout = null;

    function hideUI() {
      if (document.activeElement === document.getElementById('message-input')) return;
      autohideElements.forEach(el => el && el.classList.add('is-hidden'));
    }

    function showUI() {
      autohideElements.forEach(el => el && el.classList.remove('is-hidden'));
    }

    workspace.addEventListener('mouseleave', () => hideUI());
    workspace.addEventListener('mouseenter', () => showUI());
    workspace.addEventListener('touchstart', () => {
      showUI();
      clearTimeout(idleTimeout);
      idleTimeout = setTimeout(() => hideUI(), 3500);
    });

    /* Feature 2: Mobile Drawer State */
    let isExpanded = false;
    const sidebar = document.getElementById('left-panel');

    function toggleSidebar() {
      isExpanded = !isExpanded;
      if (isExpanded) {
        sidebar.classList.remove('w-16');
        sidebar.classList.add('w-72', 'md:w-80');
        document.querySelectorAll('.chat-item > div:nth-child(2)').forEach(el => el.classList.remove('hidden'));
      } else {
        sidebar.classList.remove('w-72', 'md:w-80');
        sidebar.classList.add('w-16');
        document.querySelectorAll('.chat-item > div:nth-child(2)').forEach(el => el.classList.add('hidden'));
      }
    }

    /* Feature 3: Dual In-App + Browser Native Notifications */
    function requestNotificationPermission(userTriggered = false) {
      if (!("Notification" in window)) return;
      if (Notification.permission === "default") {
        Notification.requestPermission();
      } else if (userTriggered && Notification.permission === "granted") {
        showInAppToast("Notifications Active", "Browser system notifications are already enabled.");
      }
    }

    function sendBrowserNotification(sender, message, avatarUrl) {
      if (!("Notification" in window)) return;

      if (Notification.permission === "granted") {
        const notification = new Notification(`New message from ${sender}`, {
          body: message,
          icon: avatarUrl || 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&auto=format&fit=crop&q=80',
          badge: avatarUrl,
          tag: 'chat-message'
        });

        notification.onclick = function() {
          window.focus();
          this.close();
        };
      }
    }

    function showInAppToast(sender, message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'animate-toast pointer-events-auto flex items-start gap-3 p-4 bg-slate-900 border border-slate-700/80 rounded-xl shadow-2xl backdrop-blur-lg';
      
      toast.innerHTML = `
        <div class="relative shrink-0">
          <span class="w-2.5 h-2.5 rounded-full bg-brand-500 inline-block"></span>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-xs font-semibold text-slate-200">${sender}</p>
          <p class="text-xs text-slate-400 truncate mt-0.5">${message}</p>
        </div>
        <button onclick="this.parentElement.remove()" class="text-slate-500 hover:text-slate-300 text-xs font-bold px-1">✕</button>
      `;

      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentElement) toast.remove();
      }, 4000);
    }

    function triggerSimulatedMessage() {
      const sender = "David Chen";
      const msg = "Hey, did you get a chance to review the pull request?";
      const avatar = "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&auto=format&fit=crop&q=80";

      // 1. Update unread badge in sidebar
      const badge = document.getElementById('unread-badge-2');
      if (badge) badge.classList.remove('hidden');

      // 2. Trigger floating in-app UI toast
      showInAppToast(sender, msg);

      // 3. Trigger native browser system notification
      sendBrowserNotification(sender, msg, avatar);
    }

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      const container = document.getElementById('messages-container');
      const msgBubble = document.createElement('div');
      msgBubble.className = 'flex items-start gap-3 max-w-lg ml-auto flex-row-reverse';
      msgBubble.innerHTML = `
        <div class="bg-brand-600 text-white p-3.5 rounded-2xl rounded-tr-sm text-sm shadow-sm">
          ${text}
        </div>
      `;
      container.appendChild(msgBubble);
      input.value = '';
      container.scrollTop = container.scrollHeight;
    }

    function selectChat(id) {
      if (id === 2) {
        const badge = document.getElementById('unread-badge-2');
        if (badge) badge.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
